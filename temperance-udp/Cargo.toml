[package]
name = "temperance-udp"
version = "2.1.0"
authors = ["James Munns <me@jamesmunns.com>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/jamesmunns/temperance"
description = "Blocking UDP clients and servers for temperance"
license = "MPL-2.0"
categories = []
keywords = [
    "serde",
]
documentation = "https://docs.rs/temperance-udp/"

[dependencies]
temperance = { version = "2.1.0", path = "../temperance", features = ["std"] }

[dev-dependencies]
postcard-schema-ng.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
